<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF7F2">
<title>Weekly report stopped · MELAN</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
@font-face{font-family:Fraunces;src:url(/fonts/Fraunces-SemiBold.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:Manrope;src:url(/fonts/Manrope-Medium.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:Manrope;src:url(/fonts/Manrope-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#FBF7F2;color:#4A3A2E;font:500 17px/1.6 Manrope,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid #E7DACA;border-radius:28px;padding:36px 28px 30px;text-align:center}
img{width:96px;height:auto;margin:0 auto 18px;display:block}
h1{font:600 28px/1.15 Fraunces,Georgia,serif;color:#1D130D}
p{margin-top:12px;font-size:16px}
a{color:#C2582F;font-weight:700;text-decoration:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="card">
  <img src="/assets/simi-listening.svg" width="136" height="166" alt="">
  <section id="working"><h1>One moment…</h1></section>
  <section id="done" hidden>
    <h1>Done. No more weekly reports.</h1>
    <p>You'll still get emails about your account, like password resets. Your scans and streak are untouched.</p>
    <p><a href="/">Back to MELAN</a></p>
  </section>
  <section id="bad" hidden>
    <h1>That link didn't work</h1>
    <p>Reply to any MELAN email with STOP and we'll take you off by hand.</p>
  </section>
  <noscript><p>Reply to any MELAN email with STOP and we'll take you off.</p></noscript>
</div>
<script src="/unsubscribe/unsubscribe.js"></script>
</body>
</html>
