<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -22 136 166" width="136" height="166" class="celebrating" role="img" aria-label="SIMI"><style>
.body{animation:float 3.4s ease-in-out infinite}
.celebrating .body{animation-duration:1.2s}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.4s infinite}
.drip{opacity:0;animation:rise 1.8s ease-out infinite}
.shimmer{animation:pulse 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.9}70%{opacity:.45}100%{transform:translateY(-34px);opacity:0}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.body,.eyes,.shimmer{animation:none}.drip{animation:none;opacity:.7}}</style><g class="shimmer"><g ><ellipse cx="60" cy="130" rx="26" ry="4.5" fill="#A6672E" opacity="0.22"></ellipse><ellipse cx="60" cy="130" rx="15" ry="2.6" fill="#C88A4A" opacity="0.28"></ellipse></g></g><g class="drip" style="animation-delay:0ms;animation-duration:1300ms"><path transform="translate(40 20)" d="M4 15 Q2 8 4 1 Q6 8 4 15 Z" fill="#C88A4A"/></g><g class="drip" style="animation-delay:400ms;animation-duration:1600ms"><path transform="translate(58 20)" d="M4 15 Q2 8 4 1 Q6 8 4 15 Z" fill="#A6672E"/></g><g class="drip" style="animation-delay:800ms;animation-duration:1450ms"><path transform="translate(74 20)" d="M4 15 Q2 8 4 1 Q6 8 4 15 Z" fill="#E8B87A"/></g><g class="body"><defs ><radialGradient id="simiPink" cx="0.36" cy="0.3" r="1.1"><stop offset="0" stop-color="#E8B87A"></stop><stop offset="0.5" stop-color="#C88A4A"></stop><stop offset="1" stop-color="#6E3D1B"></stop></radialGradient><radialGradient id="simiCool" cx="0.36" cy="0.3" r="1.1"><stop offset="0" stop-color="#C3B4A6"></stop><stop offset="0.5" stop-color="#948577"></stop><stop offset="1" stop-color="#514639"></stop></radialGradient><clipPath id="simiBody-celebrating"><path d="M60 26 Q80 38 88 58 Q97 82 88 102 Q78 120 60 120 Q44 120 34 104 Q24 84 32 60 Q40 38 60 26 Z"></path></clipPath></defs><g ><circle cx="16" cy="40" r="4" fill="#A6672E" opacity="0.8"></circle><circle cx="104" cy="30" r="3.5" fill="#C88A4A" opacity="0.7"></circle><circle cx="60" cy="16" r="3" fill="#E8B87A" opacity="0.7"></circle><path d="M30 26 l3 -6 l3 6 l-3 6 Z" fill="#E8B87A" opacity="0.8"></path><path d="M94 44 l2.5 -5 l2.5 5 l-2.5 5 Z" fill="#C88A4A" opacity="0.7"></path></g><path d="M60 26 Q80 38 88 58 Q97 82 88 102 Q78 120 60 120 Q44 120 34 104 Q24 84 32 60 Q40 38 60 26 Z" fill="url(#simiPink)" stroke="#6E3D1B" stroke-width="2.5" stroke-opacity="0.6" opacity="1"></path><g ><path d="M92 48 Q99 45 102 51 Q100 58 93 56 Q88 52 92 48 Z" fill="#C88A4A"></path><path d="M84 56 Q89 53 92 56" stroke="#C88A4A" stroke-width="2" fill="none" stroke-dasharray="3 4" opacity="0.6"></path></g><g clip-path="url(#simiBody-celebrating)"><ellipse cx="48" cy="56" rx="9" ry="15" fill="#F6DCBA" opacity="0.45" transform="rotate(-16 48 56)"></ellipse></g><g class="eyes"><g ><path d="M42 70 Q51 58 60 70" stroke="#F7F1E8" stroke-width="5" fill="none" stroke-linecap="round"></path><path d="M64 70 Q73 58 82 70" stroke="#F7F1E8" stroke-width="5" fill="none" stroke-linecap="round"></path></g></g></g></svg>
