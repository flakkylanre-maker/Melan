<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -22 136 166" width="136" height="166" class="idle" role="img" aria-label="SIMI"><style>
.body{animation:float 3.4s ease-in-out infinite}
.celebrating .body{animation-duration:1.2s}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.4s infinite}
.drip{opacity:0;animation:rise 1.8s ease-out infinite}
.shimmer{animation:pulse 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.9}70%{opacity:.45}100%{transform:translateY(-34px);opacity:0}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.body,.eyes,.shimmer{animation:none}.drip{animation:none;opacity:.7}}</style><g class="shimmer"><g ><ellipse cx="60" cy="130" rx="26" ry="4.5" fill="#A6672E" opacity="0.22"></ellipse><ellipse cx="60" cy="130" rx="15" ry="2.6" fill="#C88A4A" opacity="0.28"></ellipse></g></g><g class="drip" style="animation-delay:0ms;animation-duration:1800ms"><path transform="translate(42 20)" d="M4 15 Q2 8 4 1 Q6 8 4 15 Z" fill="#C88A4A"/></g><g class="drip" style="animation-delay:900ms;animation-duration:2100ms"><path transform="translate(72 20)" d="M4 15 Q2 8 4 1 Q6 8 4 15 Z" fill="#A6672E"/></g><g class="body"><defs ><radialGradient id="simiPink" cx="0.36" cy="0.3" r="1.1"><stop offset="0" stop-color="#E8B87A"></stop><stop offset="0.5" stop-color="#C88A4A"></stop><stop offset="1" stop-color="#6E3D1B"></stop></radialGradient><radialGradient id="simiCool" cx="0.36" cy="0.3" r="1.1"><stop offset="0" stop-color="#C3B4A6"></stop><stop offset="0.5" stop-color="#948577"></stop><stop offset="1" stop-color="#514639"></stop></radialGradient><clipPath id="simiBody-idle"><path d="M60 32 Q78 42 86 62 Q94 84 84 102 Q74 118 60 118 Q46 118 36 102 Q26 84 34 62 Q42 42 60 32 Z"></path></clipPath></defs><path d="M60 32 Q78 42 86 62 Q94 84 84 102 Q74 118 60 118 Q46 118 36 102 Q26 84 34 62 Q42 42 60 32 Z" fill="url(#simiPink)" stroke="#6E3D1B" stroke-width="2.5" stroke-opacity="0.6" opacity="1"></path><g ><path d="M92 48 Q99 45 102 51 Q100 58 93 56 Q88 52 92 48 Z" fill="#C88A4A"></path><path d="M84 56 Q89 53 92 56" stroke="#C88A4A" stroke-width="2" fill="none" stroke-dasharray="3 4" opacity="0.6"></path></g><g clip-path="url(#simiBody-idle)"><ellipse cx="48" cy="56" rx="9" ry="15" fill="#F6DCBA" opacity="0.45" transform="rotate(-16 48 56)"></ellipse></g><g class="eyes"><g ><path d="M44 66 Q51 59 58 66 L58 71 Q51 77 44 71 Z" fill="#F7F1E8"></path><path d="M62 66 Q69 59 76 66 L76 71 Q69 77 62 71 Z" fill="#F7F1E8"></path><path d="M44 66 Q51 61 58 66" stroke="#6E3D1B" stroke-width="2.2" fill="none" stroke-linecap="round"></path><path d="M62 66 Q69 61 76 66" stroke="#6E3D1B" stroke-width="2.2" fill="none" stroke-linecap="round"></path></g></g></g></svg>
